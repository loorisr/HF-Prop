name: Rebuild WASM engine (manual)

# The compiled engine (web/engine/p533.wasm) is committed, so the site needs
# no build step. Run this after changing engine/ to rebuild and download it.
on: workflow_dispatch

env:
  # Pinned toolchain for reproducible builds: https://github.com/WebAssembly/wasi-sdk/releases
  WASI_SDK_VERSION: "34"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install wasi-sdk
        run: |
          v="$WASI_SDK_VERSION"
          curl -fsSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$v/wasi-sdk-$v.0-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK=$RUNNER_TEMP/wasi-sdk-$v.0-x86_64-linux" >> "$GITHUB_ENV"
      - run: engine/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: p533-wasm
          path: web/engine/p533.wasm
